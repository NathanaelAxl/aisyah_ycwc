<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Deteksi Kacamata - Computer Vision</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  }

  body {
    min-height: 100vh;
    background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 30px 15px;
    color: #fff;
  }

  header {
    text-align: center;
    margin-bottom: 25px;
  }

  header h1 {
    font-size: 1.8rem;
    margin-bottom: 8px;
  }

  header p {
    opacity: 0.85;
    font-size: 0.95rem;
  }

  .container {
    background: rgba(255, 255, 255, 0.08);
    border: 1px solid rgba(255, 255, 255, 0.15);
    backdrop-filter: blur(10px);
    border-radius: 20px;
    padding: 25px;
    width: 100%;
    max-width: 480px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 20px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.3);
  }

  #webcam-container {
    border-radius: 16px;
    overflow: hidden;
    border: 3px solid rgba(255,255,255,0.25);
    line-height: 0;
    min-height: 200px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(0,0,0,0.2);
    width: 100%;
  }

  #webcam-container canvas {
    width: 100%;
    height: auto;
    display: block;
  }

  .btn-group {
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
    justify-content: center;
  }

  button {
    background: #ffffff;
    color: #1e3c72;
    border: none;
    padding: 12px 26px;
    border-radius: 30px;
    font-size: 0.95rem;
    font-weight: 600;
    cursor: pointer;
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }

  button:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 14px rgba(0,0,0,0.25);
  }

  button:disabled {
    opacity: 0.5;
    cursor: not-allowed;
    transform: none;
  }

  #stop-btn {
    background: #e74c3c;
    color: #fff;
  }

  #label-container {
    width: 100%;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .result-row {
    background: rgba(255,255,255,0.12);
    border-radius: 10px;
    padding: 10px 15px;
    position: relative;
    overflow: hidden;
  }

  .result-row .bar {
    position: absolute;
    left: 0;
    top: 0;
    height: 100%;
    background: rgba(46, 204, 113, 0.35);
    z-index: 0;
    transition: width 0.2s ease;
  }

  .result-row .text {
    position: relative;
    z-index: 1;
    display: flex;
    justify-content: space-between;
    font-size: 0.95rem;
    font-weight: 500;
  }

  #status {
    font-size: 0.85rem;
    opacity: 0.75;
    text-align: center;
    min-height: 18px;
  }

  footer {
    margin-top: 20px;
    font-size: 0.75rem;
    opacity: 0.6;
    text-align: center;
  }
</style>
</head>
<body>

<header>
  <h1>👓 Deteksi Kacamata</h1>
  <p>Computer Vision berbasis Teachable Machine</p>
</header>

<div class="container">
  <div id="webcam-container"></div>

  <div class="btn-group">
    <button id="start-btn" onclick="init()">Mulai Kamera</button>
    <button id="stop-btn" onclick="stopCamera()" disabled>Berhenti</button>
  </div>

  <div id="label-container"></div>
  <div id="status">Klik "Mulai Kamera" untuk memulai deteksi</div>
</div>

<footer>Model dijalankan langsung di browser (tidak ada data yang dikirim ke server)</footer>

<!-- TensorFlow.js dan library Teachable Machine -->
<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest/dist/tf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@latest/dist/teachablemachine-image.min.js"></script>

<script>
  // Ganti URL ini jika Anda mengganti model di Teachable Machine
  const URL = "https://teachablemachine.withgoogle.com/models/EfSk3GVda/";

  let model, webcam, labelContainer, maxPredictions;
  let isRunning = false;
  let rafId = null;

  async function init() {
    const statusEl = document.getElementById("status");
    document.getElementById("start-btn").disabled = true;
    statusEl.textContent = "Memuat model...";

    try {
      const modelURL = URL + "model.json";
      const metadataURL = URL + "metadata.json";

      model = await tmImage.load(modelURL, metadataURL);
      maxPredictions = model.getTotalClasses();

      const flip = true;
      webcam = new tmImage.Webcam(400, 400, flip);
      await webcam.setup();
      await webcam.play();
      isRunning = true;

      document.getElementById("webcam-container").innerHTML = "";
      document.getElementById("webcam-container").appendChild(webcam.canvas);

      labelContainer = document.getElementById("label-container");
      labelContainer.innerHTML = "";
      for (let i = 0; i < maxPredictions; i++) {
        const row = document.createElement("div");
        row.className = "result-row";
        row.innerHTML = `<div class="bar" style="width:0%"></div><div class="text"><span class="label"></span><span class="percent"></span></div>`;
        labelContainer.appendChild(row);
      }

      document.getElementById("stop-btn").disabled = false;
      statusEl.textContent = "Kamera aktif — mendeteksi...";

      loop();
    } catch (err) {
      console.error(err);
      statusEl.textContent = "Gagal memuat model. Periksa koneksi internet atau URL model.";
      document.getElementById("start-btn").disabled = false;
    }
  }

  async function loop() {
    if (!isRunning) return;
    webcam.update();
    await predict();
    rafId = window.requestAnimationFrame(loop);
  }

  async function predict() {
    const prediction = await model.predict(webcam.canvas);
    prediction.sort((a, b) => b.probability - a.probability);

    for (let i = 0; i < maxPredictions; i++) {
      const p = prediction[i];
      const percent = (p.probability * 100).toFixed(1);
      const row = labelContainer.children[i];
      row.querySelector(".bar").style.width = percent + "%";
      row.querySelector(".label").textContent = p.className;
      row.querySelector(".percent").textContent = percent + "%";
    }
  }

  function stopCamera() {
    isRunning = false;
    if (rafId) cancelAnimationFrame(rafId);
    if (webcam) webcam.stop();
    document.getElementById("webcam-container").innerHTML = "";
    document.getElementById("status").textContent = "Kamera dihentikan. Klik \"Mulai Kamera\" untuk mulai lagi.";
    document.getElementById("start-btn").disabled = false;
    document.getElementById("stop-btn").disabled = true;
  }
</script>

</body>
</html>
